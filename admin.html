<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Mercado Amigo</title>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="logo">Mercado<span>Amigo</span></a>
    <div class="nav-links">

  <div class="admin-container">

    <!-- HEADER -->
    <div class="admin-header">
      <h1>Panel de AdministraciÃ³n</h1>
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="avisos" onclick="switchAdminTab('avisos')">Avisos</button>
        <button class="admin-tab" data-tab="config" onclick="switchAdminTab('config')">ConfiguraciÃ³n</button>

      <div class="admin-table">
        <table>
          <thead>
            <tr>
              <th>TÃ­tulo</th>
              <th>CategorÃ­a</th>
              <th>Estado</th>
              <th>Fecha</th>

            <!-- Se llenan dinÃ¡micamente -->

          <label>MÃ¡ximo de fotos por aviso</label>

          <label>MÃ¡ximo de caracteres por descripciÃ³n</label>

        <div class="setting-row">
          <label>MÃ¡ximo de avisos por usuario</label>

        <button class="btn-submit" style="margin-top:16px;" onclick="saveAdminConfig()">Guardar configuraciÃ³n</button>

    </div>

  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      loadAdmin();
    });
  </script>
</body>
</html>
